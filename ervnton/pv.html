    <script>
        (function() {
            var CFG = window.PAGE_CONFIG || {};
            var PITCH_TIME = parseInt(CFG.PITCH_SECONDS, 10) || 0;

            /* ----------------------------------------------------------------
               Link do botão + repasse de UTMs
               ---------------------------------------------------------------- */
            var ctaButton = document.querySelector('[data-cta]');
            if (ctaButton && CFG.CTA_URL) ctaButton.setAttribute('href', CFG.CTA_URL);

            /* os parâmetros da URL atual seguem para todos os links da página,
               sem sobrescrever o que o link já carrega (tracking do afiliado) */
            function repassarParametros() {
                var entrada = new URLSearchParams(location.search);
                if (!entrada.toString()) return;
                var links = document.querySelectorAll('a[href]');
                for (var i = 0; i < links.length; i++) {
                    var link = links[i];
                    if (!/^(https?:\/\/|\/)/.test(link.getAttribute('href'))) continue;
                    var destino = new URLSearchParams(link.search);
                    entrada.forEach(function(valor, chave) {
                        if (!destino.get(chave)) destino.set(chave, valor);
                    });
                    link.search = destino.toString();
                }
            }
            if (document.readyState !== 'loading') repassarParametros();
            else document.addEventListener('DOMContentLoaded', repassarParametros);
            /* links revelados depois do load também recebem os parâmetros */
            window.addEventListener('click', function(e) {
                var a = e.target && e.target.closest ? e.target.closest('a') : null;
                if (a) repassarParametros();
            }, true);

            /* ----------------------------------------------------------------
               Gate do pitch: revela o CTA no segundo configurado do VÍDEO
               ---------------------------------------------------------------- */
            var cta = document.getElementById('cta');
            var revelado = false;

            function revelar() {
                if (revelado) return;
                revelado = true;
                cta.classList.add('is-visible');
                /* espera o layout recalcular depois do display:block antes de rolar */
                requestAnimationFrame(function() {
                    cta.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                });
            }

            /* Com player VTurb o gate segue o tempo do VÍDEO, que é mais fiel
               (quem pausa não ganha o botão adiantado). Com qualquer outro
               player, cai no tempo de página — assim a troca do embed não
               quebra a liberação do botão. */
            function ligar(player) {
                ligado = true;
                player.on('timeupdate', function(time) {
                    if (revelado || player.smartAutoPlay) return;
                    var atual = typeof time === 'number' ? time :
                        (player.video ? player.video.currentTime : 0);
                    if (atual >= PITCH_TIME) revelar();
                });
            }

            var ligado = false;
            var tentativas = 0;
            var inicio = Date.now();

            /* o player registra window.smartplayer.instances de forma assíncrona */
            (function procurarPlayer() {
                var sp = window.smartplayer;
                if (sp && sp.instances && sp.instances.length) return ligar(sp.instances[0]);

                /* passou de 12s sem player VTurb: arma o tempo de página, mas
                   segue procurando — se o player aparecer depois, ele manda */
                if (++tentativas === 12 && CFG.FALLBACK_TIMER !== false) {
                    setTimeout(function() {
                        if (!ligado) revelar();
                    }, Math.max(0, PITCH_TIME * 1000 - (Date.now() - inicio)));
                }
                if (tentativas < 60) setTimeout(procurarPlayer, 1000);
            })();
        })();
    </script>
