<!DOCTYPE html>
<html lang="en">

<head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yjtaa7652h");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow" />
    <title>Age Verification</title>

    <!-- ============================================================
         ⚙️  EDITE SÓ ESTA LINHA
         ============================================================
         VSL_URL = para onde o botão "Yes" leva (a página da VSL).

         Os 2 arquivos na mesma pasta? Não precisa mexer em nada.
         VSL em outro lugar? Cole a URL completa dela, por exemplo:
             VSL_URL: "https://seudominio.com/pv/"
         ============================================================ -->
    <script>
        window.PAGE_CONFIG = {
            VSL_URL: "pv.html"
        };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 30px;
        }

        .emoji {
            font-size: 140px;
            line-height: 1;
            user-select: none;
        }

        h1 {
            color: #ffffff;
            font-size: 56px;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .yes-button {
            background-color: #4CDB1E;
            color: #ffffff;
            font-size: 42px;
            font-weight: 700;
            padding: 18px 56px;
            border: none;
            border-radius: 14px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }

        .yes-button:hover {
            background-color: #3FC418;
            transform: translateY(-2px);
        }

        .yes-button:active {
            transform: translateY(1px);
        }

        @media (max-width: 600px) {
            .emoji {
                font-size: 90px;
            }
            h1 {
                font-size: 32px;
            }
            .yes-button {
                font-size: 30px;
                padding: 14px 42px;
            }
        }
    </style>

    <!-- HW Publishing tracking -->
    <script type="text/javascript" src="https://cdn.nlabs.cloud/assets/main/js/trackcontrol.min.js" defer></script>
    <script type="text/javascript" src="https://cdn.nlabs.cloud/assets/main/js/affiliate-trackcontrol.min.js" defer></script>
    <script type="text/javascript" src="https://cdn.nlabs.cloud/assets/main/js/everflow.min.js" defer></script>
</head>

<body class="cc" data-funnel="homefunnel">
    <div class="container">
        <div class="emoji">😈</div>
        <h1>Are you over 21 years old?</h1>
        <!-- o href é preenchido pelo VSL_URL lá do topo -->
        <a href="index.html" class="yes-button" data-next>Yes</a>
    </div>

    <script>
        (function() {
            var CFG = window.PAGE_CONFIG || {};

            var botao = document.querySelector('[data-next]');
            if (botao && CFG.VSL_URL) botao.setAttribute('href', CFG.VSL_URL);

            /* os parâmetros da URL atual seguem para a próxima página — sem isso
               o tracking morre aqui e a VSL recebe o visitante sem UTM */
            function repassarParametros() {
                var entrada = new URLSearchParams(location.search);
                if (!entrada.toString()) return;
                var links = document.querySelectorAll('a[href]');
                for (var i = 0; i < links.length; i++) {
                    var link = links[i];
                    var destino = new URLSearchParams(link.search);
                    entrada.forEach(function(valor, chave) {
                        if (!destino.get(chave)) destino.set(chave, valor);
                    });
                    link.search = destino.toString();
                }
            }
            if (document.readyState !== 'loading') repassarParametros();
            else document.addEventListener('DOMContentLoaded', repassarParametros);
            window.addEventListener('click', function(e) {
                var a = e.target && e.target.closest ? e.target.closest('a') : null;
                if (a) repassarParametros();
            }, true);
        })();
    </script>
</body>

</html>
